[package]
name = "tabi_ui"
version = "0.4.0"
edition = "2024"
description = "Reusable Dioxus components"
repository = "https://github.com/falineth/tabi_ui"
license = "MIT"

[dependencies]
dioxus = { version = "=0.7.9", features = ["router"] }
dioxus-free-icons = { version = "=0.10.0", features = ["bootstrap"] }
nanoid = { version = "=0.5.0", optional = true }
nanoid-wasm = { version = "=0.1.3", features = ["wasm"], optional = true }
web-sys = { version = "=0.3.91", features = ["Storage"], optional = true }
dirs = { version = "=6.0.0", optional = true }
dbus-tokio = { version = "=0.7.6", optional = true }
tokio = { version = "=1.52.1", optional = true }
dbus = { version = "=0.9.11", optional = true }

[features]
desktop = [
    "dioxus/desktop",
    "dep:nanoid",
    "dep:dbus",
    "dep:dirs",
    "dep:dbus-tokio",
    "dep:tokio",
]
web = ["dioxus/web", "dep:nanoid-wasm", "dep:web-sys"]
